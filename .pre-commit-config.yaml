# Pre-commit Hooks 配置
# 安装: pre-commit install
# 手动运行: pre-commit run --all-files
# 更新 hooks: pre-commit autoupdate

repos:
  # =========================================================================
  # 通用检查
  # =========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: 移除行尾空白
      - id: end-of-file-fixer
        name: 文件末尾空行修复
      - id: check-yaml
        name: YAML 语法检查
        args: [--allow-multiple-documents]
      - id: check-json
        name: JSON 语法检查
      - id: check-toml
        name: TOML 语法检查
      - id: check-added-large-files
        name: 大文件检查（>500KB）
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: 合并冲突检查
      - id: detect-private-key
        name: 私钥泄露检查
      - id: detect-aws-credentials
        name: AWS 凭证泄露检查
      - id: mixed-line-ending
        name: 换行符统一
        args: [--fix=lf]
      - id: no-commit-to-branch
        name: 禁止直接提交到 main/develop
        args: [--branch, main, --branch, develop]

  # =========================================================================
  # Python 代码格式化与检查（Ruff）
  # =========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        name: Ruff 代码检查
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff 代码格式化

  # =========================================================================
  # Python 静态类型检查（Mypy）
  # =========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: Mypy 类型检查
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --no-error-summary
        additional_dependencies:
          - pydantic>=2.0
          - sqlalchemy>=2.0
          - types-redis
          - types-python-jose
        files: ^app/

  # =========================================================================
  # Python 安全扫描（Bandit）
  # =========================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Bandit 安全扫描
        args:
          - -ll
          - --skip=B101
        # B101: assert 使用（测试文件中允许）
        files: ^app/

  # =========================================================================
  # 前端代码检查（ESLint + Prettier）
  # 注意：需要前端项目独立安装 node_modules
  # =========================================================================
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v9.3.0
  #   hooks:
  #     - id: eslint
  #       name: ESLint 前端代码检查
  #       files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
  #       types: [file]
  #       additional_dependencies:
  #         - eslint@9
  #         - typescript@5
  #         - '@typescript-eslint/eslint-plugin@7'
  #         - '@typescript-eslint/parser@7'

  # - repo: https://github.com/pre-commit/mirrors-prettier
  #   rev: v4.0.0-alpha.8
  #   hooks:
  #     - id: prettier
  #       name: Prettier 前端格式化
  #       files: ^frontend/src/.*\.(ts|tsx|js|jsx|css|json)$
  #       types: [file]

  # =========================================================================
  # 提交信息检查（Conventional Commits）
  # =========================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        name: 提交信息格式检查
        stages: [commit-msg]
        args:
          - --strict
          # 允许的类型
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
          - agent
          - rule

# =========================================================================
# CI 跳过配置
# 提交信息中包含 [skip ci] 或 [ci skip] 时跳过 CI
# =========================================================================
ci:
  autofix_commit_msg: "chore: auto-fix by pre-commit [skip ci]"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks [skip ci]"
  autoupdate_schedule: weekly