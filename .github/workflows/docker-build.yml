name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-build.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job 1: 构建并推送 Docker 镜像
  # ==========================================================================
  build-and-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # 用于 cosign 签名
      id-token: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # ====================================================================
      # 元数据提取
      # ====================================================================
      - name: Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 分支名
            type=ref,event=branch
            # PR 号
            type=ref,event=pr
            # 语义化版本标签 (v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 短 commit SHA
            type=sha,prefix=,format=short
            # latest 标签（仅 main 分支）
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ====================================================================
      # 设置 QEMU（多架构构建支持）
      # ====================================================================
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      # ====================================================================
      # 设置 Docker Buildx
      # ====================================================================
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ====================================================================
      # 登录容器注册表
      # ====================================================================
      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 可选：登录 Docker Hub
      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      # ====================================================================
      # 构建并推送镜像
      # ====================================================================
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构：amd64 + arm64
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 构建参数
          build-args: |
            PYTHON_VERSION=3.12
            ENVIRONMENT=production
          # 构建时注入的 secret（不缓存到镜像层）
          # secrets: |
          #   "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}"

      # ====================================================================
      # 镜像签名（cosign）
      # ====================================================================
      - name: 安装 cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: 签名镜像
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      # ====================================================================
      # 镜像扫描（Trivy）
      # ====================================================================
      - name: Trivy 镜像漏洞扫描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          timeout: "10m"

      - name: 上传 Trivy 扫描结果
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

      # ====================================================================
      # 生成摘要
      # ====================================================================
      - name: 生成构建摘要
        if: always()
        run: |
          echo "## Docker 镜像构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 标签 | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 架构 | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 摘要 | ${{ steps.build-and-push.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Job 2: 镜像大小检查
  # ==========================================================================
  image-size-check:
    name: "Image Size Check"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request'

    steps:
      - name: 检查镜像大小
        run: |
          echo "## 镜像大小检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 可通过 Docker Hub / GHCR 查看镜像层大小" >> $GITHUB_STEP_SUMMARY
          echo "> 目标：最终镜像 < 500MB（slim 基础镜像 + 仅运行时依赖）" >> $GITHUB_STEP_SUMMARY