apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: supply-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: worker
          image: supply-chain-risk-control:latest
          command: ["python", "-m", "app.workers.notifications"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
