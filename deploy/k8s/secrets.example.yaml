# =============================================================================
# 供应链智能决策系统 - K8s Secret 模板
# 复制为 secrets.yaml 并填入真实值，secrets.yaml 已在 .gitignore 中排除。
# 生产环境建议使用 External Secrets Operator 或 Sealed Secrets 管理。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: supply-chain
  labels:
    app: supply-chain-risk-control
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "change-me"
  JWT_SECRET_KEY: "change-me-to-a-random-secret-key"
  LLM_API_KEY: ""
  LANGSMITH_API_KEY: ""
