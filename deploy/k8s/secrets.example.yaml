# =============================================================================
# 供应链智能决策系统 - K8s Secret 模板
# 复制为 secrets.yaml 并填入真实值，secrets.yaml 已在 .gitignore 中排除。
# 生产环境建议使用 External Secrets Operator 或 Sealed Secrets 管理。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: supply-chain
  labels:
    app: supply-chain-risk-control
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "change-me"
  JWT_SECRET_KEY: "REPLACE_WITH_64_RANDOM_CHARACTERS"
  SETTINGS_ENCRYPTION_KEY: "REPLACE_WITH_GENERATED_FERNET_KEY"
  DATABASE_URL: "mysql+asyncmy://supply_chain_app:REPLACE@mysql.supply-chain.svc.cluster.local:3306/supply_chain_risk"
  MIGRATION_DATABASE_URL: "mysql+asyncmy://schema_migrator:REPLACE@mysql.supply-chain.svc.cluster.local:3306/supply_chain_risk"
  MYSQL_USER: "supply_chain_app"
  MYSQL_PASSWORD: "REPLACE"
  RABBITMQ_USER: "supply_chain_app"
  RABBITMQ_PASSWORD: "REPLACE"
  RABBITMQ_URL: "amqp://supply_chain_app:REPLACE@rabbitmq.supply-chain.svc.cluster.local:5672/"
  LLM_API_KEY: ""
  LANGSMITH_API_KEY: ""
