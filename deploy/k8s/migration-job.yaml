apiVersion: batch/v1
kind: Job
metadata:
  name: schema-migration-003
  namespace: supply-chain
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: supply-chain-risk-control:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MIGRATION_DATABASE_URL
