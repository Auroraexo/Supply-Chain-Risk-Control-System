<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1280px; height:640px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; color:#f8fafc; padding:80px; }
.tag { color:#38bdf8; font-size:22px; letter-spacing:2px; margin-bottom:24px; }
h1 { font-size:64px; font-weight:700; line-height:1.2; margin-bottom:16px; }
.sub { font-size:24px; color:#94a3b8; margin-bottom:60px; max-width:900px; line-height:1.5; }
.badges { display:flex; gap:12px; flex-wrap:wrap; }
.badge { background:#334155; padding:10px 20px; border-radius:20px; font-size:16px; color:#cbd5e1; }
.arch { position:absolute; right:80px; bottom:80px; display:flex; flex-direction:column; gap:10px; }
.layer { background:rgba(56,189,248,0.1); border:1px solid #38bdf8; padding:10px 24px; border-radius:6px; font-size:15px; color:#38bdf8; text-align:center; }
</style></head><body>
<div class="tag">OPEN SOURCE · MIT LICENSE</div>
<h1>Supply Chain<br/>Risk Control System</h1>
<div class="sub">Multi-agent platform on FastAPI + LangGraph: data QC → risk scoring → reflection → rule-based decision → human review → immutable audit.</div>
<div class="badges">
  <div class="badge">FastAPI</div>
  <div class="badge">LangGraph</div>
  <div class="badge">React</div>
  <div class="badge">MySQL</div>
  <div class="badge">RabbitMQ</div>
  <div class="badge">Redis</div>
</div>
<div class="arch">
  <div class="layer">Scout · Analyst · Reflection · Decider</div>
</div>
</body></html>
